name: Pruebas

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Pruebas del proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Ejecutar pruebas en Chrome
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom "file://$GITHUB_WORKSPACE/tests/test-runner.html" > test-results.html
          if ! grep -Eq 'id="summary"[^>]*class="pass">[1-9][0-9]* pruebas: [1-9][0-9]* correctas, 0 fallidas' test-results.html; then
            cat test-results.html
            exit 1
          fi